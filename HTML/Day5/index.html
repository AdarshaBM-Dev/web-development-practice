<!DOCTYPE html>
<html>
    <head>
        <title>Form and inputs</title>
    </head>
    <body>
        <!--Form and inputs-->
        <form>
            <p>
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" placeholder="Enter the Name">
            </p>
            <!--Email-->
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" placeholder="Enter your Email">
            </p>
            <!--Passward-->
            <p>
                <label for="password">Password</label><br>
                <input type="password" id="passward" placeholder="Enter Password">
            </p>
            <!--Number-->
            <p>
                <label for="age">Age</label><br>
                <input type="number" id="age" placeholder="Enter your age">
            </p>
            <!--Date-->
            <p>
                <label for="birthdate">Birthdate</label><br>
                <input type="date" id="birthdate">
            </p>

            <!--Textarea -->
            <p>
                <label for="message">Message</label><br>
                <textarea name="message" id="message" cols="50" rows="5"></textarea>
            </p>

            <!--Select-->
            <p>
                <label for="gender">Gender</label>
                <select name="gender" id="gender">
                    <option value="male">Male</option>
                    <option value="female" selected>Female</option>
                    <option value="other">Others</option>
                </select>
            </p>

            <!--Radiobutten-->
            <p>
                <label for="hobbies">Hobbies</label><br>
                <input type="radio" name="hobbies" value="drawing" id="hobbies">Drawing<br>
                <input type="radio" name="hobbies" value="singing" id="hobbies" checked>Singing<br>
                <input type="radio" name="hobbies" value="dancing" id="hobbies">Dancing<br>
            </p>

            <!--Checkbox-->
            <p>
                <label for="hobbies">Hobbies</label><br>
                <input type="checkbox" name="hobbies" value="drawing" id="hobbies">Drawing<br>
                <input type="checkbox" name="hobbies" value="singing" id="hobbies" checked>Singing<br>
                <input type="checkbox" name="hobbies" value="dancing" id="hobbies">Dancing<br>
            </p>
            
            <!--using input-->
            <input type="submit" value="submit"><br><br>

            <!--Butten tag-->
            <button type="submit">Submit</button><br><br>

             <!--using input-->
            <input type="reset" value="reset"><br><br>

            <!--Butten tag-->
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
