<!DOCTYPE html>
<html>
    <head>
        <title>List and Table</title>
    </head>
    <body>
        <!--Unordered list-->
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <!--Ordered list-->
        <ol type="I">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>

        <!--Nested list-->
        <ul>
            <li>HTML
                <ul>
                    <li>HTML5</li>
                    <li>HTML4</li>
                </ul>
            </li>
            <li>CSS
                <ul>
                    <li>CSS3</li>
                    <li>CSS2</li>
                </ul>
            </li>
            <li>JavaScript
                <ul>
                    <li>ES6</li>
                    <li>ES5</li>
                </ul>
            </li>
        </ul>

        <!--Table-->
        <table>
            <thead>
                <tr>
                    <th>Frist NAme</th>
                    <th>Last Name</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Adarsha</td>
                    <td>BM</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Adarsha</td>
                    <td>BM</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Adarsha</td>
                    <td>BM</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>Adarsha</td>
                    <td>BM</td>
                    <td>23</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
